<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Succuleaf_迷你展示</title>
  <link rel="stylesheet" href="./css/index.css">
  <script src="./js/script.js"></script>
  <style>
    body {
      line-height: 2;
      background-image: url(./images/index/ads/ads6.jpg);
    }
  </style>
</head>

<body>

  <header>
    <div style="position: relative;">

      <h1 style="font-size: 2.25rem;font-weight: normal;">
        <a href="./index.html" style="text-decoration: none; color: inherit;">
          <img class="logo" src="./images/index/logo.png">
          <span>SuccuLeaf</span> 溯植綠
        </a>
      </h1>
    </div>

    <nav class="nav-desktop">
      <a href="./brand.html">品牌故事</a>
      <a href="./items.html">迷你展示</a>
      <a href="./contact.html">聯絡我們</a>
    </nav>
  </header>
  <main style="margin-top: 10rem"></main>
  <section
    style="border-radius: 10vh; padding: 2rem; max-width:80rem; margin:0 auto; text-align:center;background-color: rgba(255, 255, 255, 0.617)">
    <h2 style="font-size:2.5rem; margin-bottom:3rem;">迷你展示</h2>

    <section class="product-section">
      <div id="product-container" class="grid grid-2 grid-3">
        <p>產品載入中...</p>
      </div>
    </section>


    <br>
    <br>
    <button class="checkout-btn" onclick="goCheckout()">前往結帳</button>
  </section>

  <footer>
    © 2025 SuccuLeaf 多肉生活
  </footer>

  <button id="backToTopBtn" title="回到最頂端">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7" />
    </svg>
  </button>

  <script>
    //商品品項
    // 取得 HTML 裡的容器
    const container = document.getElementById('product-container');

    // 開始抓取資料
    fetch('products.json')
      .then(response => {
        if (!response.ok) throw new Error('找不到資料檔');
        return response.json();
      })
      .then(data => {
        // 1. 清除「載入中」的文字
        container.innerHTML = '';

        // 2. 跑迴圈產生卡片
        data.forEach(product => {
          const cardHTML = `
                <div class="card">
                    <img src="${product.image}" loading="lazy" alt="${product.name}" />
                    <h3>${product.name}</h3>
                    <p>${product.description}</p>
                    <button onclick="addToCart('${product.name}', '${product.name}', ${product.price}, '${product.image}')">
                        加入購物車
                    </button>
                </div>
            `;
          // 3. 塞入容器
          container.innerHTML += cardHTML;
        });
      })
      .catch(error => {
        container.innerHTML = '<p>抱歉，目前無法載入產品，請稍後再試。</p>';
        console.error('Error:', error);
      });

    //加入購物車
    function addToCart(id, name, price, img) {
      let cart = JSON.parse(sessionStorage.getItem('cart')) || [];

      const item = cart.find(p => p.id === id);
      if (item) {
        item.qty += 1;
      } else {
        cart.push({ id, name, price, img, qty: 1 });
      }

      sessionStorage.setItem('cart', JSON.stringify(cart));
      alert('商品已加入購物車');
    }

    function goCheckout() {
      window.location.href = 'checkout.html';
    }

  </script>

</body>

</html>
