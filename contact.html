<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Succuleaf_聯絡我們</title>
  <link rel="stylesheet" href="./css/index.css">
  <script src="./js/script.js"></script>
  <style>
    body {
      line-height: 2;
      background-image: url(./images/index/ads/ads6.jpg);
    }

    .hero {
      /* ... 保持您原有的样式 ... */
      width: 30%;
      margin: 40vh auto;
      padding: 5em;
      /* 這是您想讓連結覆蓋的範圍 */
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      /* 關鍵：為絕對定位的子元素 .contact 提供參考點 */
      background: #ffffffa8;
      border-radius: 5em;
      z-index: 1;
      animation: floatY 6s ease-in-out infinite;
      cursor: pointer;
      /* 移除 .hero 上的 text-align 和 display 相關屬性，或將其移動到 .contact 上，
       因為 .contact 現在是主要的內容容器。 */
    }

    /* 確保背景和模糊效果保留在 .hero 上 */
    .hero::before {
      /* ... 保持不變 ... */
      content: "";
      position: absolute;
      inset: -20px;
      /*等同於top: -20px;right: -20px;bottom: -20px;left: -20px;*/
      background: rgba(255, 255, 255, 0.6);
      filter: blur(20px);
      border-radius: inherit;
      z-index: -1;
    }

    /* 新增或修改 .contact 的樣式 */
    .hero .contact {
      /* 關鍵步驟：讓連結覆蓋整個 .hero 區域 */
      position: absolute;
      inset: 0;
      /* 讓 top/right/bottom/left 都為 0，覆蓋父元素 .hero 的內容區和 padding 區 */

      /* 確保內容（h1）在連結內正確居中 */
      display: flex;
      justify-content: center;
      align-items: center;

      /* 將所有顯示相關的樣式從 .hero 移到 .contact */
      text-align: center;
      text-decoration: none;
      /* 移除連結下劃線，如果需要 */
      color: inherit;
      /* 繼承顏色，如果需要 */

      /* Z-index 確保連結在動畫和背景之上 */
      z-index: 2;
    }

    /* 讓 h1 在連結內保持正常的文本樣式 */
    .hero .contact h1 {
      margin: 0;
      /* 移除 h1 默認的 margin，避免影響居中 */
      /* 添加 h1 專屬的文本樣式 */
    }

    @keyframes floatY {

      /* ... 保持不變 ... */
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-18px);
      }

      100% {
        transform: translateY(0);
      }
    }

    .hero .contact {
      font-size: 1.25rem;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <header>
    <div style="position: relative;">

      <h1 style="font-size: 2.25rem;font-weight: normal;">
        <a href="./index.html" style="text-decoration: none; color: inherit;">
          <img class="logo" src="./images/index/logo.png">
          <span>SuccuLeaf</span> 溯植綠
        </a>
      </h1>
    </div>

    <nav class="nav-desktop">
      <a href="./brand.html">品牌故事</a>
      <a href="./items.html">迷你展示</a>
      <a href="./contact.html">聯絡我們</a>
    </nav>
  </header>

  <section class="hero" id="hero">
    <a class="contact" href="https://lin.ee/NgHW9ea">
      <h1>
        點line服務
      </h1>
    </a>
  </section>

  <footer>
    © 2025 SuccuLeaf 多肉生活
  </footer>

  <button id="backToTopBtn" title="回到最頂端">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7" />
    </svg>
  </button>

</body>

</html>
