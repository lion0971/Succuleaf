  <style>
    .together {
      height: 80vh;
      position: relative;
      background-size: cover;
    }

    .together0 {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
    }

    .together1 {

      position: sticky;
      top: 0;
      /* 加上 top 才會黏住 */
      z-index: 20;
      /* 確保過場時不會被後面（文件順序較晚）的區塊蓋住 */
    }

    /* Scattered → gather 圖片 */

    .succ {
      position: absolute;
      left: 50%;
      top: 0;
      /* 從上方開始 */
      transform: translate(-50%, 0);
      max-width: 150px;
      transition: transform 0.2s linear, opacity 0.2s linear;
    }

    .header-banner {
      width: 100%;
      display: flex;
      justify-content: center;
      /* 水平置中 */
      align-items: center;
      /* 垂直置中 */
      padding: 1.5rem 0;
      /* 上下留白，可依需求調整 */
      background-color: #ffffff;
      /* 可設定背景底色 */
    }

    .logo {
      max-width: 100%;
      /* 確保手機版不會超出螢幕寬度 */
      height: auto;
      /* 維持圖片原本的長寬比，不拉伸變形 */
      display: block;
      /* 消除 img 預設底部的微小空隙 */
    }

    .logo1 {
      max-width: 100%;
      /* 確保手機版不會超出螢幕寬度 */
      height: 50px;
      /* 維持圖片原本的長寬比，不拉伸變形 */
      /*display: block;*/
      /* 消除 img 預設底部的微小空隙 */
    }

    .about-container {
      position: relative;
      /* 👈 關鍵：作為按鈕 absolute 定位的基準 */
      display: inline-block;
      /* 或 width: 100%; 依據你的版面需求 */
      width: 100%;
    }

    .about-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .btn-outline {
      /* 定位設定 */
      position: absolute;
      top: 78%;
      /* 👈 垂直位置：根據圖片位置微調（數字越大越靠下） */
      left: 56%;
      /* 👈 水平位置：根據圖片位置微調（數字越大越靠右） */

      /* 按鈕樣式 (保留你原本的設定) */
      display: inline-flex;
      align-items: center;
      gap: 18px;

      padding: 10px 26px;

      border: 1.5px solid #687b5d;
      border-radius: 50px;

      color: #687b5d;
      background-color: transparent;
      /* 確保背景透明，露出底圖 */
      text-decoration: none;
      /* 移除超連結底線 */
      font-size: 1rem;
      font-weight: 500;

      transition: all .3s ease;
      cursor: pointer;
    }

    .btn-outline:hover {
      background: #687b5d;
      color: white;
      transform: translateY(-2px);
    }

    /*左半部廣告輪播 */
    .ads-notice {
      display: flex;
      position: relative;
    }

    .ads-notice .carousel-container {
      position: sticky;
      top: 0;
      left: 0;
      width: 50vw;
      height: 100vh;
      overflow: hidden;

      /* 羽化邊框：讓外框四邊柔化 */
      -webkit-mask-image: radial-gradient(circle 80% at 50% 50%,
          rgba(0, 0, 0, 1) 60%,
          rgba(0, 0, 0, 0) 100%);
      mask-image: radial-gradient(circle 80% at 50% 50%,
          rgba(0, 0, 0, 1) 60%,
          rgba(0, 0, 0, 0) 100%);
    }

    .ads-notice .carousel-container .carousel {
      width: 100%;
      height: 100%;
      display: flex;
      transition: transform 0.8s ease-in-out;
    }

    .ads-notice .carousel-container .carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .ads-notice .ads2 {
      padding: 20px;
      /* ← 這不是 sticky 的 top */
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 只針對這個特定區塊：把輪播和右側說明區的高度都改成原本 100vh 的三分之二 */
    .ads-notice--compact .carousel-container,
    .ads-notice--compact .ads2 {
      height: calc(100vh * 2 / 3);
    }

    /* 覆蓋層 */
    .fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, rgb(217, 255, 147), rgb(100, 200, 255));
      z-index: -1;

      /* 使用 radial-gradient 做羽化邊緣 */
      mask-image: radial-gradient(circle at top left, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: radial-gradient(circle at top left, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%);
      mask-repeat: no-repeat;
      -webkit-mask-repeat: no-repeat;
      mask-position: top left;
      -webkit-mask-position: top left;
      mask-size: 0% 0%;
      /* 初始半徑 0% */
      -webkit-mask-size: 0% 0%;
    }

    .fill.active {
      animation: fillBlue 2s linear forwards;
    }

    @keyframes fillBlue {
      0% {
        mask-size: 0% 0%;
        -webkit-mask-size: 0% 0%;
      }

      100% {
        mask-size: 200% 200%;
        /* 從左上角擴散填滿整個框 */
        -webkit-mask-size: 200% 200%;
      }
    }

    .ads-notice {
      display: flex;
      /* 讓子元素 (.carousel-container 和 .ads2) 水平並排 */
      align-items: flex-start;
      /* 讓子元素從頂端對齊 (預設值，但明確寫出更好) */
      /* 這裡假設 .ads-notice 已經在您的其他 CSS 中定義了 */
    }

    .ads-notice .ads2 h2 {

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      line-height: 2em;
      width: 50vw;
      height: 100%;
      padding: 0 10vw;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.4s ease-out, transform 0.4s ease-out;
      font-weight: large;
    }

    .ads-notice .ads2 h2.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== Hero Section ===== */
    .hero {
      position: relative;
      z-index: 30;
      /* 高於 .together1（花朵，z-index:20），確保 .fill 跟文字整組都在花朵上層 */
      width: 20%;
      height: 30vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 15em 0;
    }

    .hero h2 {
      position: relative;
      /* 作為 ::before 方框的定位基準 */
      z-index: 1;
      /* 明確數字才會建立獨立堆疊層，讓內部的 ::before 穩定排在 .fill 之上 */
      font-weight: large;
      color: #00271c;

      line-height: 2;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
      font-weight: large;
    }

    /* 環繞文字的線圈（SVG 橢圓），預設完全隱藏（描邊進度為 0） */
    .hero h2 .ring {
      position: absolute;
      /* 利用 50% + translate(-50%, -50%) 強制幾何點完全重疊 */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      /* 這裡直接自由控制橢圓的大小 */
      width: calc(100% + 4em);
      /* 水平總寬度 */
      height: calc(100% + 6em);
      /* 垂直總高度 */

      overflow: visible;
      pointer-events: none;
      z-index: -1;

      /* ... 原本定位 CSS ... */
      backdrop-filter: blur(4px);
      /* 讓背景花朵或圖片變模糊 */
      -webkit-backdrop-filter: blur(4px);
      border-radius: 50%;
      /* 確保毛玻璃範圍符合橢圓外框 */
    }

    .hero h2 .ring ellipse {
      fill: none;
      stroke: #00271c;
      stroke-width: 0.6;
      stroke-linecap: round;
      stroke-dasharray: 100;
      /* 搭配 ellipse 的 pathLength="100"，方便用百分比控制 */
      stroke-dashoffset: 100;
      /* 100 = 完全沒畫出來 */
      transition: stroke-dashoffset 1.2s ease-out;
    }

    .hero h2.show .ring ellipse {
      stroke-dashoffset: 0;
      /* 0 = 完整畫完一整圈 */
    }

    .hero h2.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hero p {
      font-size: 1.125rem;
      color: #4b5563;
      max-width: 36rem;
      line-height: 1.75rem;

    .content {
      position: sticky;
      top: 0;
      /* sticky 必須有定位點 */
      height: 100vh;
      /* 才能垂直置中 */
      display: flex;
      align-items: center;

      justify-content: center;

    #title-block {

    #title-block h3 {

    }

    #title-block p {
      color: #4b5563;
      margin-top: 0.5rem;
    }

    #title-block h4 {
      font-size: 2rem;
      font-weight: bold;
      padding: auto;
    }

    /*橫向圖片滑動-起*/
    .container {
      width: 80%;
      /* 容器寬度 */
      height: 200px;
      /* 容器高度 */
      overflow: hidden;
      /* 超出範圍隱藏 */
      margin: 30px auto;
      position: relative;
    }

    .scroll-wrapper {
      display: flex;
      transition: transform 0.2s ease;
      /* 平滑滑動 */
    }

    .scroll-wrapper img {
      width: 280px;

      margin-right: 10px;
      object-fit: cover;
    }

    /*橫向圖片滑動-止*/

    /* ===== Header 縮小效果 =====
       改用 CSS Grid 讓 .brand（置中）與 .nav-desktop（靠左）疊在同一格，
       全部用相對單位（justify-self / auto）運算，不寫死任何 px/rem 座標，
       所以不管視窗寬度、字體大小如何都不會跑版或偏移。
       尺寸（min-height / padding）連續漸變，
       同時疊加短暫的半透明淡化來柔化排版模式（flex/grid）切換那一刻的跳動，
       但不會完全消失，感覺是「平滑縮放 + 輕微柔焦」而不是「消失再出現」。 */
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 9rem;
      /* 保留原本未縮小時的高度感，可依實際視覺再調整這個數字 */
      transition: padding 0.35s ease, min-height 0.35s ease, opacity 0.35s ease;
    }

    /* 未縮小狀態：讓 nav 脫離文件流貼齊底部，
       這樣不會影響標題在 flex 容器中的垂直置中。 */
    header .nav-desktop {
      position: absolute;
      left: 1.5rem;
      /* 對齊 index.css 原本 header 的左側 padding */
      bottom: 1rem;
      /* 貼齊 header 底部的距離，可依實際視覺微調 */
    }

    header.shrink {
      display: grid;
      grid-template-columns: 1fr;
      /* 讓這一欄撐滿整個 header 寬度 */
      justify-content: stretch;
      /* 覆蓋放大狀態的 justify-content: center */
      align-items: center;
      min-height: 0;
      /* 取消 9rem 限制，讓縮小狀態可以正常收合 */
      padding: 0.6rem 1.5rem;
    }

    header.shrink .brand,
    header.shrink .nav-desktop {
      grid-column: 1;
      grid-row: 1;
      position: static;
      /* 取消先前 absolute 定位，改回讓 grid 控制 */
    }

    header.shrink .brand {
      justify-self: center;
    }

    header.shrink .nav-desktop {
      justify-self: start;
    }
  </style>
</head>

  <script>
    // header 隨滾動縮放（加上遲滯區間 + rAF 節流，避免抖動）
    // 尺寸（min-height/padding）連續漸變；同時疊加短暫的淡化來柔化
    // flex/grid 排版模式切換那一刻的跳動，但不會完全消失。
    const header = document.querySelector('header');
    const SHRINK_ON = 80;   // 滑超過這個距離才「開始」縮小
    const SHRINK_OFF = 40;  // 滑回小於這個距離才「恢復」原狀（比 SHRINK_ON 小，形成緩衝區間）

    function setShrink(shouldShrink) {
      const isShrunk = header.classList.contains('shrink');
      if (isShrunk === shouldShrink) return; // 狀態沒變就不重複觸發

      header.classList.toggle('shrink', shouldShrink); // 立即切換，讓 padding/min-height 開始連續漸變

      // 疊加短暫的半透明淡化，柔化排版模式切換那一刻的跳動（不會完全消失）
      header.style.opacity = '0.4';
      requestAnimationFrame(() => {
        header.style.opacity = '1';
      });
    }

    let ticking = false;

    function updateHeader() {
      const y = window.scrollY;

      if (y > SHRINK_ON) {
        setShrink(true);
      } else if (y < SHRINK_OFF) {
        setShrink(false);
      }
      // 介於 SHRINK_OFF 與 SHRINK_ON 之間時，維持目前狀態不變，避免來回抖動

      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(updateHeader);
        ticking = true;
      }
    });

    // <!-- Framer Motion Animation -->
    const carousels = document.querySelectorAll('.carousel');

    carousels.forEach(carousel => {
      let slides = Array.from(carousel.children);
      const interval = 2500;

      const firstClone = slides[0].cloneNode(true);
      const lastClone = slides[slides.length - 1].cloneNode(true);

      firstClone.classList.add("clone");
      lastClone.classList.add("clone");

      carousel.appendChild(firstClone);
      carousel.insertBefore(lastClone, slides[0]);

      slides = Array.from(carousel.children);
      let index = 1;

      carousel.style.transform = `translateX(-${index * 100}%)`;

      function nextSlide() {
        index++;
        carousel.style.transition = "transform 0.8s ease";
        carousel.style.transform = `translateX(-${index * 100}%)`;
      }

      carousel.addEventListener("transitionend", () => {
        if (slides[index].classList.contains("clone")) {
          carousel.style.transition = "none";

          if (index === slides.length - 1) {
            index = 1;
          } else if (index === 0) {
            index = slides.length - 2;
          }

          carousel.style.transform = `translateX(-${index * 100}%)`;
        }
      });

      // ===== 自動輪播：可暫停 / 恢復 =====
      let timerId = null;

      function startAutoplay() {
        if (timerId !== null) return; // 已經在跑就不重複建立
        timerId = setInterval(nextSlide, interval);
      }

      function stopAutoplay() {
        clearInterval(timerId);
        timerId = null;
      }

      startAutoplay();

      // 點擊/觸碰這個輪播時，先暫停自動播放
      carousel.addEventListener("click", stopAutoplay);

      // 使用者滾動頁面（移動畫面）時，如果目前是暫停狀態就恢復播放
      window.addEventListener("scroll", startAutoplay, { passive: true });
    });



    // scattered → gather
    const imgs = [];
    for (let i = 1; i <= 5; i++) {
      imgs.push({
        el: document.getElementById("s" + i),
        x: (Math.random() * 600 - 300),
        y: (Math.random() * 400 - 200),
        rot: (Math.random() * 160 - 80)
      });
    }

    // 花朵聚集完成後的最終位置（固定值，不會再跟著滾動移動）。
    // 之後想調整聚集位置，只要改這個數字就好：數字越大，聚集點越往下。
    const GATHER_Y = 300;

    // 滾動多少距離（px）動畫才會跑完（p 從 0 到 1）。
    // 數字越小 → 滾一樣的距離動畫跑得越快；數字越大 → 動畫跑得越慢。
    // 目前設成 1 個視窗高度，可以改成固定數字（例如 800）或視窗高度的倍數（例如 window.innerHeight * 1.5）。
    const SCROLL_RANGE = window.innerHeight;

    function update() {
      const p = Math.min(1, window.scrollY / SCROLL_RANGE);

      imgs.forEach(obj => {
        const tx = obj.x * (1 - p);
        // 在「起始分散位置 obj.y」跟「聚集後的最終位置 GATHER_Y」之間插值，
        // p=0 時 ty = obj.y（起始位置不受 GATHER_Y 影響）
        // p=1 時 ty = GATHER_Y（完全聚集到目標位置）
        const ty = obj.y * (1 - p) + GATHER_Y * p;

        const r = obj.rot + p * 360;

        obj.el.style.transform =
          `translate(${tx}px, ${ty}px) rotate(${r}deg) scale(${1 - p * 0.3})`;

        obj.el.style.opacity = 0.8 + p * 0.2;
      });
    }

    window.addEventListener("scroll", update);
    update();

    /*文字上移浮現*/

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
          observer.unobserve(entry.target); // 加上這行只播放一次
        }
      });
    }, { threshold: 0.35 }); // 稍微延後觸發時機（比 0.2 晚一點，但不用等到 0.6）

    const h2Elements = document.querySelectorAll('.ads-notice h2, .hero h2');
    h2Elements.forEach(h2 => observer.observe(h2));

    //fill
    const fills = document.querySelectorAll('.fill');

    const observer1 = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const fillEl = entry.target.querySelector('.fill');
          if (fillEl) fillEl.classList.add('active');
        }
      });
    }, { threshold: 0.5 });

    fills.forEach(fill => observer1.observe(fill.parentElement));

    //橫向滑動
    const scrollWrapper = document.getElementById('scrollWrapper');
    const contentEl = document.querySelector('.content'); // 改用「圖片區真正所在」的 .content 作為判斷基準
    let scrollX = 0;

    // .content 是 position: sticky; top: 0；只要它「正被釘在頂端」（rect.top 約等於 0），
    // 就代表圖片區真的定住在視窗正中間（.content 內部本身用 flex 置中排版）。
    // 還沒開始被釘住（top > 0，還在自然滑入）或已經釘完離開（top < 0），都不算「在中間」，不鎖定畫面。
    function isContentPinned() {
      const rect = contentEl.getBoundingClientRect();
      return Math.abs(rect.top) < 1; // 容許 1px 以內的誤差
    }


    // --- 滾輪事件監聽器 ---
    window.addEventListener('wheel', (e) => {
      // 只有當圖片區真的被釘在視窗正中間時，才執行圖片滾動邏輯
      if (!isContentPinned()) return;

      const container = document.querySelector('.container');
      const containerWidth = container.offsetWidth;
      const contentWidth = scrollWrapper.scrollWidth;
      const maxScrollLeft = containerWidth - contentWidth;

      const scrollingDown = e.deltaY > 0;
      const atEnd = scrollX <= maxScrollLeft;   // 圖片已經滑到最右邊（全部看完）
      const atStart = scrollX >= 0;             // 圖片還在最左邊（都還沒開始滑）

      // 已經到底、且使用者繼續往同方向滾 → 放行，讓視窗往該方向繼續移動
      if (scrollingDown && atEnd) return;
      if (!scrollingDown && atStart) return;

      // 圖片還沒滑到底 → 完全鎖住畫面，只移動圖片，避免任何漏出去的捲動造成抖動
      e.preventDefault();

      // 您原來的邏輯是：滾輪向下 (e.deltaY > 0) -> 圖片向左 (scrollX 減小)
      scrollX -= e.deltaY;

      // 限制範圍：
      if (scrollX > 0) scrollX = 0;
      if (scrollX < maxScrollLeft) scrollX = maxScrollLeft;

      scrollWrapper.style.transform = `translateX(${scrollX}px)`;
    }, { passive: false }); // 明確設為非被動，確保 preventDefault 一定生效

  </script>

</body>
